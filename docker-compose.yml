version: "3.8"

services:

  frontend:

    build:
      context: ./app/frontend

    ports:
      - "3000:80"

  backend:

    build:
      context: ./app/backend

    ports:
      - "5000:5000"

  mysql:

    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devopsdb

    ports:
      - "3306:3306"
      